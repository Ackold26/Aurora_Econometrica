# lefthook — git hooks для Aurora Econometrica.
# Установка: npm install → `npx lefthook install` (автоматически через `prepare` script).
# Bypass: git commit --no-verify (использовать только если понимаешь зачем).

pre-commit:
  parallel: true
  commands:
    v40-xss:
      # Без glob-фильтра: линтер сам сканирует весь src/ (<1с) и срабатывает
      # на любой коммит, включая изменения самого линтера или bypass-комментов.
      # С glob: "src/**/*.svelte" hook пропускался если модифицировался только
      # tools/lint-xss.mjs — линтер мог сломаться в мастере молча.
      run: node tools/lint-xss.mjs

    decomposestep-regression-guard:
      # Защита от удаления DecomposeStep onMount guard (регрессия ловилась 4 раза подряд).
      # Reference commit: 29fd0c6 (rc1.4) — fix(decompose): не вызывать runDecompose пока нет обученной модели.
      # Ловит accidental removal at commit time, не runtime regression
      # (для runtime — см. src/tests/decompose-step.test.js, D2 Level 2).
      glob: "src/lib/components/pipeline/DecomposeStep.svelte"
      run: |
        if ! grep -q "channelParams" {staged_files}; then
          echo ""
          echo "❌ DecomposeStep.svelte не содержит guard для channelParams."
          echo "   Регрессия: onMount спамит /compute/decompose на Validate step."
          echo "   Reference commit: 29fd0c6 (rc1.4)"
          echo "   Ожидаемый паттерн: if (!get(modelData)?.channelParams) { ... return; }"
          echo ""
          exit 1
        fi
