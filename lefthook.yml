# lefthook — git hooks для Aurora Econometrica.
# Установка: npm install → `npx lefthook install` (автоматически через `prepare` script).
# Bypass: git commit --no-verify (использовать только если понимаешь зачем).

pre-commit:
  parallel: true
  commands:
    v40-xss:
      # Без glob-фильтра: линтер сам сканирует весь src/ (<1с) и срабатывает
      # на любой коммит, включая изменения самого линтера или bypass-комментов.
      # С glob: "src/**/*.svelte" hook пропускался если модифицировался только
      # tools/lint-xss.mjs — линтер мог сломаться в мастере молча.
      run: node tools/lint-xss.mjs

    decomposestep-regression-guard:
      # Защита от удаления DecomposeStep onMount guard (регрессия ловилась 4+ раза).
      # Reference: 29fd0c6 (rc1.4 onMount guard), rc1.5 ($effect idle-aware).
      # Ловит accidental removal at commit time.
      glob: "src/lib/components/pipeline/DecomposeStep.svelte"
      run: grep -q channelParams {staged_files} || (echo ERROR DecomposeStep channelParams guard missing; exit 1)

    sync-help-lists:
      # Sprint 5: auto-rebuild help docs auto-sections когда BRAND_HINTS/PERF_HINTS
      # changed. Pattern: НЕ fail on drift (annoying UX), а auto-fix + git add.
      # CI separately verifies через --check mode (catches push-without-build).
      glob:
        - "sidecar/econometrica/utils/channel_categorization.py"
        - "src-tauri/help-econometrica/*.html"
      run: |
        python tools/sync_help_lists.py
        git add src-tauri/help-econometrica/

    cabinet-drift-guard:
      # Аудит 2026-07: кабинет econometrist копировался руками в 11 репо/
      # worktree без единого механизма синка — правки в SSOT молча не долетали
      # до остальных. SSOT-пара (repo/worktree) должна совпадать после мержа
      # веток; --strict-pair явно требует этого на коммите. Hub-копии со своей
      # легитимной SCOPE-редакцией — вне этой проверки (см. tools/check_cabinet_drift.py).
      glob: "New_AI_Agency/econometrist/**"
      run: python tools/check_cabinet_drift.py --strict-pair
