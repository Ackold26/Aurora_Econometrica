[pytest]
# Sprint 5 Infrastructure Hardening — pytest configuration.
# Pytest discovers test_*.py в tools/ (existing standalone scripts retain
# `if __name__ == '__main__': main()` for backward compat — оба пути работают).

testpaths = tools
python_files = test_*.py
python_functions = test_*

# Markers — register чтобы избежать PytestUnknownMarkWarning.
markers =
    smoke: synthetic-only, fast (<2min total) — runs on CI
    requires_real_data: needs AURORA_TESTDATA_DIR env var, skipped on CI
    integration: full pipeline (validate→train→decompose→optimize), may train MCMC
    slow: tests that take >10s individually

# Default options.
# -ra: show short summary of all extra outcomes (skipped, errors, etc.)
# --strict-markers: error on undefined markers
# --tb=short: short traceback format (less noise)
addopts =
    -ra
    --strict-markers
    --tb=short
