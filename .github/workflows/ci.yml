name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test & Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Prompt & delivery linters
        # Вечная оборона по находкам аудита промптов (2026-07-13, Батч 5):
        # структура/тире/термины/шапка/блокировка команд econometrist ·
        # четверное совпадение cabinet.rs<->cabinets.json<->файлы<->command-meta-data.json ·
        # синхронность content-pack manifest (Ed25519 + sha256) ·
        # синхронность глоссария (SSOT источник -> 3 выхода). Способны падать (внести-поймать-откатить).
        run: |
          python -m pip install --quiet cryptography
          python tools/lint_prompt_commands.py
          python tools/check_help_consistency.py
          python tools/check_content_pack_sync.py
          python tools/check_glossary_sync.py
        shell: bash

      - name: Build frontend
        run: npm run build

      - name: Svelte Check
        run: npx svelte-check --tsconfig ./jsconfig.json

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      # Sprint 5: lefthook hooks defense-in-depth (catches --no-verify bypass)
      - name: V40 XSS lint
        run: node tools/lint-xss.mjs

      - name: DecomposeStep regression guard
        run: |
          if (Get-Content src/lib/components/pipeline/DecomposeStep.svelte | Select-String -Quiet 'channelParams') {
            Write-Host "✓ DecomposeStep channelParams guard intact"
          } else {
            Write-Error "DecomposeStep channelParams guard missing"
            exit 1
          }
        shell: pwsh

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest  # Python tests don't need Windows MSVC — faster + cheaper
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-aurora
        with:
          install-test-deps: 'true'
          install-mcmc-deps: 'false'  # lightweight — no PyMC/JAX install

      - name: Pytest discovery (unit + smoke)
        run: python -m pytest -n auto --tb=short -m "not requires_real_data and not slow"

      # Note: Heavy MCMC integration tests (require full sidecar deps) — оставляем
      # local-only через `pip install -r sidecar/econometrica/requirements.txt`.
      # CI runs только pytest-discoverable tests без MCMC training.

  help-sync:
    name: Help Docs Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-aurora
        with:
          install-test-deps: 'false'  # no pytest needed

      - name: Verify help auto-sections in sync
        run: |
          if [ -f tools/sync_help_lists.py ]; then
            python tools/sync_help_lists.py --check
          else
            echo "sync_help_lists.py not yet present — skip"
          fi

  release:
    name: Build Release
    needs: [check, python-tests, help-sync]  # Sprint 5: block release на ALL prior jobs green
    # ОТКЛЮЧЁН (2026-07-18, санкция Антона): job собирает exe БЕЗ build_sidecar.py
    # (python-бандл 970MB не собирается в CI) → артефакт с неполным sidecar, без
    # смоук-гейта INV-96. Канонический релиз-канал — локальная сборка по регламенту
    # aurora-release-update + публикация в Ackold26/aurora-releases. Прецеденты:
    # на тегах v2.3.1/v2.4.0 job релиза не оставлял. Вернуть — заменив false на
    # startsWith(github.ref, 'refs/tags/v') ПОСЛЕ добавления шага сборки sidecar.
    if: false
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Enable .NET 3.5 for WiX
        run: |
          DISM /Online /Enable-Feature /FeatureName:NetFx3 /All /NoRestart || echo "Feature may already be enabled"
        shell: cmd

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build release
        run: cargo tauri build

      - name: Compute SHA256 checksums
        run: |
          Get-ChildItem -Path src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } |
            Tee-Object -FilePath checksums.txt
        shell: pwsh

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            checksums.txt
          body_path: checksums.txt
          draft: true

      - name: Update manifest (rosst-updates)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.ROSST_UPDATES_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $product = (Get-Content src-tauri/Cargo.toml -Raw | Select-String 'name\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $checksum = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($exe.Name)"

          $manifest = @{
            version = $version
            download_url = $downloadUrl
            checksum = "sha256:$checksum"
            release_notes = "Release $version"
            mandatory = $false
            min_version = "0.1.0"
          } | ConvertTo-Json

          $manifestB64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($manifest))
          $path = "$product/latest.json"

          # Get current file SHA (if exists)
          $existingSha = $null
          try {
            $existing = gh api "repos/ackold26/rosst-updates/contents/$path" 2>$null | ConvertFrom-Json
            $existingSha = $existing.sha
          } catch {}

          $body = @{ message = "Update $product to $version"; content = $manifestB64 }
          if ($existingSha) { $body.sha = $existingSha }

          gh api -X PUT "repos/ackold26/rosst-updates/contents/$path" --input - <<< ($body | ConvertTo-Json)
          Write-Host "Manifest updated: $product v$version"
        shell: pwsh

      - name: Update Supabase app_versions
        if: success()
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $product = (Get-Content src-tauri/Cargo.toml -Raw | Select-String 'name\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $checksum = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($exe.Name)"

          $body = @{
            product = $product
            version = $version
            download_url = $downloadUrl
            checksum = "sha256:$checksum"
            release_notes = "Release $version"
            mandatory = $false
            min_version = "0.1.0"
            updated_at = (Get-Date -Format "o")
          } | ConvertTo-Json

          $headers = @{
            "apikey" = $env:SUPABASE_SERVICE_KEY
            "Authorization" = "Bearer $($env:SUPABASE_SERVICE_KEY)"
            "Content-Type" = "application/json"
            "Prefer" = "resolution=merge-duplicates"
          }

          Invoke-RestMethod -Uri "https://quzhkfvglqmppxcrindh.supabase.co/rest/v1/app_versions" `
            -Method Post -Headers $headers -Body $body

          Write-Host "Supabase app_versions updated: $product v$version"
        shell: pwsh
