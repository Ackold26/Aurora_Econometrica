name: Setup Aurora environment
description: |
  Composite action: настраивает Python + pip cache + (optional) Rust toolchain.
  DRY pattern для CI jobs (Sprint 5 Infrastructure Hardening).

inputs:
  python-version:
    description: Python version
    required: false
    default: '3.12'
  install-rust:
    description: Install Rust toolchain (with clippy)
    required: false
    default: 'false'
  install-python:
    description: Install Python + pip deps
    required: false
    default: 'true'
  install-test-deps:
    description: Install pytest + pytest-xdist (без heavy MCMC stack)
    required: false
    default: 'true'
  install-mcmc-deps:
    description: Install full sidecar requirements (PyMC, NumPyro, JAX) — slow
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Two variants of setup-python: с pip cache (когда есть deps to install)
    # и без cache (Help Docs Sync — install-test-deps='false', /home/runner/.cache/pip
    # пустой → Post Run cleanup fails). Composite action `if:` на step gating работает,
    # но cache: 'pip' attribute не conditional — поэтому две step'ы с разными условиями.
    - name: Setup Python (with pip cache)
      if: inputs.install-python == 'true' && (inputs.install-test-deps == 'true' || inputs.install-mcmc-deps == 'true')
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'

    - name: Setup Python (no pip cache)
      if: inputs.install-python == 'true' && inputs.install-test-deps == 'false' && inputs.install-mcmc-deps == 'false'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pytest deps (lightweight + medium)
      if: inputs.install-python == 'true' && inputs.install-test-deps == 'true' && inputs.install-mcmc-deps == 'false'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # numpy + pandas нужны conftest fixtures (synthetic + kagocel pathology pickles).
        # 2026-05-23 CI infrastructure fix sprint: добавлены medium-weight deps что нужны
        # для pytest *discovery* (не только execution) на test files что import их at
        # module level: sklearn (test_priors_calibration / test_priors_real_data),
        # openpyxl (audit_v2 brand/perf constraint tests + test_lift_formula_canonical),
        # fastapi/httpx/pytest-asyncio (forecast_context endpoint tests). Без них
        # pytest collection падает с ImportError ДО -m marker фильтра, делая weighted
        # test selection бесполезным. Heavy PyMC/JAX/arviz stack остаётся gated за
        # install-mcmc-deps='true' для local + occasional integration runs.
        # filelock: sidecar импортит на уровне модуля (project-lock / persistence) →
        # без него pytest collection падает ImportError для многих тестов ДО -m фильтра.
        pip install pytest pytest-xdist pytest-asyncio httpx filelock \
          'numpy>=1.24.0,<3.0' 'pandas>=2.0.0' \
          scikit-learn openpyxl fastapi python-pptx

    - name: Install full sidecar deps (PyMC + NumPyro)
      if: inputs.install-python == 'true' && inputs.install-mcmc-deps == 'true'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r sidecar/econometrica/requirements.txt pytest pytest-xdist

    - name: Setup Rust toolchain
      if: inputs.install-rust == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache cargo
      if: inputs.install-rust == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-
