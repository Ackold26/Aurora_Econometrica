<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Agency</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <script>
      try { const t = JSON.parse(localStorage.getItem('ai-agency-theme')); if (t === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch {}
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
