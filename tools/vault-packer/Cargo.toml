[package]
name = "vault-packer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vault-pack"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
tar = "0.4"
flate2 = "1"
anyhow = "1"
walkdir = "2"
