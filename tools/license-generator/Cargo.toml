[package]
name = "license-generator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "license-gen"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
