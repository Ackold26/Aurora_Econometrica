[package]
name = "aurora-econometrica-gui"
version = "2.4.3"
description = "Aurora AI Econometrica - Marketing Mix Modeling with Claude AI"
authors = ["Ackold"]
edition = "2021"

[lib]
name = "aurora_econometrica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# default = облачная редакция. Локальная редакция (152-ФЗ) собирается БЕЗ default-фич:
#   cargo build --no-default-features  (или tauri build -- --no-default-features)
# → feature `cloud_advisors` выключена → run_claude/run_claude_pipeline делают ранний bail
#   ДО спавна Claude CLI; кабинет-советник econometrist скрыт (filter_by_product). 0 egress.
default = ["cloud_advisors"]
# cloud_advisors — кабинеты-советники на Anthropic (Claude). Единственная точка egress —
# claude.rs::run_claude_inner, достижимая только через gated run_claude/run_claude_pipeline.
cloud_advisors = []
# Включается по умолчанию ТОЛЬКО в AI_APP_AGENCY - единственный «native» Agency
# продукт. В 9 форках feature отсутствует → legacy %APPDATA%\AIAgency\license.json
# fallback компилируется в zero-LOC. См. memory/project_per_user_port_isolation.md.
legacy_aiagency_fallback = []
# 🔴 Признака `thin` и зависимости на крейт шлюза здесь НЕТ намеренно (ADR-048).
# Слово `optional` управляет компиляцией, но НЕ разрешением графа зависимостей:
# пока объявление стояло здесь, обычная сборка тоже требовала чужой репозиторий по
# относительному пути — то есть падала в проверках, при выпуске по метке и у
# любого, кто просто склонировал проект. Локально это работало случайно, потому
# что рабочее дерево лежало на нужной глубине.
#
# Тонкая поставка собирается своим манифестом: базовый + `Cargo.cloud.fragment.toml`
# через `npm run tauri:build:cloud`. Так инвариант «обычная поставка не зависит от
# облачной» выполняется буквально, а не на словах.

[lints.rust]
# Признак `thin` объявлен только во фрагменте облачной поставки, а
# `#[cfg(feature = "thin")]` стоит в общем коде — иначе компилятор ругается на
# «неизвестный признак» при обычной сборке. Прочие опечатки в cfg по-прежнему видны.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("thin"))'] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# MCP Bridge для DOM-driven визуального аудита (visual-audit skill).
# Регистрируется ТОЛЬКО под #[cfg(debug_assertions)] в lib.rs (см. build_app);
# сервер не стартует в release. Источник = github.com/hypothesi/mcp-server-tauri
# (тот же проект, что MCP-сервер с mcp__tauri__* инструментами).
tauri-plugin-mcp-bridge = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Obfuscation
obfstr = "0.4"

# Crypto
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
rand = "0.8"

# Utils
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
tempfile = "3"
tar = "0.4"
flate2 = "1"

# PPTX pipeline response parsing
regex = "1"

# XLSX export
rust_xlsxwriter = "0.79"

# ZIP export for pipeline results
zip = { version = "2", default-features = false, features = ["deflate"] }

# HTTP client for update checks
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "multipart"], default-features = false }
futures-util = "0.3"

# Soft-delete (move to OS trash instead of rm)
trash = "5"

# Non-blocking child.wait - защита от зависания shutdown на зомби-процессе
wait-timeout = "0.2"

# SID hashing для deterministic per-user port allocation (RDP multi-user isolation)
xxhash-rust = { version = "0.8", features = ["xxh3"] }


# Windows system info + API для process owner detection
[target.'cfg(windows)'.dependencies]
wmi = "0.14"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
# filetime для тестов mtime-sort логики в project_load_comparison.
filetime = "0.2"
