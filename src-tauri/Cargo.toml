[package]
name = "aurora-econometrica-gui"
version = "1.0.7"
description = "Aurora AI Econometrica — Marketing Mix Modeling with Claude AI"
authors = ["Ackold"]
edition = "2021"

[lib]
name = "aurora_econometrica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Obfuscation
obfstr = "0.4"

# Crypto
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
rand = "0.8"

# Utils
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
tempfile = "3"
tar = "0.4"
flate2 = "1"

# PPTX pipeline response parsing
regex = "1"

# XLSX export
rust_xlsxwriter = "0.79"

# ZIP export for pipeline results
zip = { version = "2", default-features = false, features = ["deflate"] }

# HTTP client for update checks
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "multipart"], default-features = false }
futures-util = "0.3"

# Soft-delete (move to OS trash instead of rm)
trash = "5"

# Non-blocking child.wait — защита от зависания shutdown на зомби-процессе
wait-timeout = "0.2"

# Windows system info
[target.'cfg(windows)'.dependencies]
wmi = "0.14"
