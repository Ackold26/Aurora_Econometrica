# Фрагмент манифеста тонкой (облачной) поставки Эконометрики — ADR-048.
#
# 🔴 Зачем отдельный фрагмент, а не строки в Cargo.toml. Слово `optional` у
# зависимости управляет КОМПИЛЯЦИЕЙ, но не разрешением графа: пока объявление
# стояло в обычном манифесте, обычная сборка тоже требовала чужой репозиторий по
# относительному пути — и падала в проверках, при выпуске по метке и у любого,
# кто просто склонировал проект. Работало это только локально и только случайно:
# рабочее дерево лежало на нужной глубине.
#
# Теперь обычный `Cargo.toml` о шлюзе не знает вовсе, а облачная сборка склеивает
# его с этим фрагментом (`npm run tauri:build:cloud` → `tools/build-cloud.mjs`).
# Инвариант «обычная поставка не зависит от облачной» выполняется буквально.
#
# 🔴 Почему фрагмент, а не второй полный манифест: полная копия неизбежно
# разъехалась бы с основной. Здесь дублировать нечего — фрагмент содержит РОВНО
# то, что добавляет облачная поставка.
#
# Имя признака у Эконометрики историческое (`thin`), у Oracle — `cloud`. Различие
# внутреннее и ни на что не влияет: протокол переноса требует не имени, а того,
# чтобы объявление жило здесь и включало сетевой слой. Переименование задело бы
# уже выданную клиенту сборку и документацию, ничего не давая пользователю.

[features]
# Тонкая версия ставится ПОВЕРХ обычной и ничего не отключает: согласие и гейт
# местного режима остаются, меняется только место исполнения кабинета-советника.
thin = ["dep:aurora_gateway"]

[dependencies]
# Общий облачный слой тонких клиентов из aurora-platform-core — единый источник
# для всей линейки, а не копия из программы в программу.
#
# Признак `cloud-http` включает сетевую часть контракта v1: без него в крейте
# собирается только чистая часть, а клиента шлюза попросту нет.
#
# 🔴 Путь ведёт в дерево ВЕТКИ ОБЛАКА, а не основной линии. Прежде здесь стояло
# `_wt_core_main`, и это молча привязывало сборку к тому, что лежит в дереве main:
# правки общего слоя, живущие в ветке облака, в продукт не доезжали вовсе — а
# прогоны оставались зелёными, потому что собиралась прежняя версия крейта.
# Потолок ожидания работы (находка аудита 6) так и не действовал бы у клиента.
#
# 🔴 Зависимость по МЕТКЕ, а не по пути в рабочее дерево. Путь брал то, что лежит
# на диске прямо сейчас, и продукт однажды собрался с крейтом из ДРУГОЙ ветки —
# сотни зелёных проверок при том, что правки общего слоя в продукт не доезжали
# вовсе. Метка неизменна: собралось ровно то, что записано.
#
# Проверяется запросом к удалённому репозиторию (`git ls-remote --tags`), а не
# наличием каталога: каталог мог оказаться чужим деревом.
aurora_gateway = { git = "https://github.com/Ackold26/aurora-platform-core.git", tag = "aurora_gateway-v0.6.5", features = ["cloud-http"], optional = true }
